# Publishes a GitHub Release for every version tag (v1.0, v1.1, ...): the ready-built interface (payload/mq_ui)
# plus the standalone apps, the Windows app, complete ZIP and checksums as downloads, with the notes from docs/releases/<tag>.md. Push a tag and the release appears.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Windows app and its Linux environment
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y mono-devel debootstrap
          sh windows/build.sh
          sudo sh windows/wsl/build-env.sh
          sudo chown -R "$(id -u):$(id -g)" windows/out vendor

      - name: Collect the release files
        run: |
          set -e
          python3 tools/package-release.py
          cat dist/SHA256SUMS dist/MD5SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="CHANGELOG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "diskOS Disco! ${TAG#v}" --notes-file "$NOTES" --latest
          fi
